apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcode-redis-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transcode-redis
  template:
    metadata:
      labels:
        app: transcode-redis
    spec:
      containers:
        - image: redis
          name: transcode-redis
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: transcode-redis-srv
spec:
  selector:
    app: transcode-redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379